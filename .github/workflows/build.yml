name: Build CloudStream Extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Clean old builds
        run: |
          find "$GITHUB_WORKSPACE/builds" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build all extensions and plugin list
        working-directory: src
        run: |
          gradle make makePluginsJson ensureJarCompatibility --stacktrace

      - name: Publish all plugin builds
        run: |
          find src -type f -path '*/build/*.cs3' -exec cp {} builds/ \;
          find src -type f -path '*/build/*.jar' -exec cp {} builds/ \;
          cp src/build/plugins.json builds/
          cp src/repo.json builds/
          cd builds
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "Build ${GITHUB_SHA}" || exit 0
          git push origin builds

      - name: Upload CS3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-proxy-extension
          path: "src/**/build/*.cs3"
          if-no-files-found: error
